        'board-buttons': function(t) {
          return [{
            icon: {
             dark: 'https://trello-attachment-downloader.vercel.app/icon.svg',
light: 'https://trello-attachment-downloader.vercel.app/icon.svg'
            },
            text: 'Download Attachments',
            callback: function(t) {
             return t.modal({
  url: 'https://trello-attachment-downloader.vercel.app',

  fullscreen: false,
});

          }];
        }
      }, {

        appName: 'Downloader'                
      });

  </head>
